<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#060A12" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <title>RV HUD</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #060a12;
        overscroll-behavior: none;
      }
      #root {
        min-height: 100vh;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.jsx"></script>
    <script>
      /* Plain ES5 — runs on any browser. If the app bundle never executes
         (e.g. a browser too old to run it), #root stays empty and the screen
         looks black. Replace that with a readable message + the browser string
         so the problem is diagnosable instead of a blank screen. */
      setTimeout(function () {
        var root = document.getElementById("root");
        if (root && root.childElementCount === 0) {
          root.innerHTML =
            '<div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;font-family:system-ui,sans-serif;color:#EAF2FF;text-align:center;background:#060A12">' +
            '<div style="font-size:20px;font-weight:700">RV HUD couldn’t start</div>' +
            '<div style="font-size:14px;color:#9fb3d1;max-width:520px;line-height:1.5">This usually means the browser is out of date. Open the Play Store, update <b>Google Chrome</b> to the latest version, then reopen this app.</div>' +
            '<div style="font-size:12px;color:#6b7f9e;max-width:520px">If it still fails, send this line:</div>' +
            '<code style="font-size:11px;color:#7f93b3;word-break:break-all;max-width:520px">' +
            navigator.userAgent +
            "</code></div>";
        }
      }, 5000);
    </script>
  </body>
</html>
